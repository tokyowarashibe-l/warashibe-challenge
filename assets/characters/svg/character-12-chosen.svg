<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="100%" height="100%" fill="#F8F5F2"/>
  <!-- Wig (masuo style) -->
  <ellipse cx="200" cy="135" rx="58" ry="48" fill="#1A1A1A"/>
  <circle cx="155" cy="130" r="22" fill="#1A1A1A"/>
  <circle cx="245" cy="130" r="22" fill="#1A1A1A"/>
  <circle cx="145" cy="155" r="20" fill="#1A1A1A"/>
  <circle cx="255" cy="155" r="20" fill="#1A1A1A"/>
  <circle cx="200" cy="95" r="26" fill="#1A1A1A"/>
  <circle cx="175" cy="100" r="20" fill="#1A1A1A"/>
  <circle cx="225" cy="100" r="20" fill="#1A1A1A"/>
  <!-- Face -->
  <ellipse cx="200" cy="152" rx="36" ry="30" fill="#F8F5F2"/>
  <!-- Eyes (determined) -->
  <circle cx="182" cy="145" r="6" fill="#264653"/>
  <circle cx="218" cy="145" r="6" fill="#264653"/>
  <circle cx="180" cy="143" r="2" fill="white"/>
  <circle cx="216" cy="143" r="2" fill="white"/>
  <!-- Eyebrows (angled for determination) -->
  <path d="M 170,138 L 190,142" fill="none" stroke="#264653" stroke-width="3" stroke-linecap="round"/>
  <path d="M 230,138 L 210,142" fill="none" stroke="#264653" stroke-width="3" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="200" cy="158" rx="4" ry="3" fill="#264653"/>
  <!-- Mouth (determined line) -->
  <path d="M 190,170 Q 200,175 210,170" fill="none" stroke="#264653" stroke-width="3" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="200" cy="220" rx="35" ry="38" fill="#FFFFFF" stroke="#264653" stroke-width="4"/>
  <!-- Arms (raised in challenge pose) -->
  <path d="M 170,210 Q 140,190 130,175" fill="none" stroke="#264653" stroke-width="4" stroke-linecap="round"/>
  <path d="M 230,210 Q 260,190 270,175" fill="none" stroke="#264653" stroke-width="4" stroke-linecap="round"/>
  <!-- Fist (right hand raised) -->
  <circle cx="130" cy="170" r="8" fill="#264653"/>
  <!-- Legs -->
  <path d="M 182,253 L 178,280" fill="none" stroke="#264653" stroke-width="4" stroke-linecap="round"/>
  <path d="M 218,253 L 222,280" fill="none" stroke="#264653" stroke-width="4" stroke-linecap="round"/>
</svg>
